	<script>
		// Stamps touch capability onto <html> ONCE, before any CSS is
		// applied. This is the single source of truth the mobile CSS
		// (action-bar.css / filter-panel.css / plot-popup-mobile.css)
		// keys off, instead of `(hover:none) and (pointer:coarse)` or a
		// width breakpoint -- both of which can shift mid-rotation on
		// some mobile/in-app browsers and cause the layout to snap back
		// to the desktop styles. Touch capability itself never changes
		// when the device rotates, so a class set once here can't flip
		// back the way a live media-query re-evaluation can.
		document.documentElement.classList.toggle(
			"is-touch-device",
			("ontouchstart" in window) ||
			(navigator.maxTouchPoints > 0) ||
			(navigator.msMaxTouchPoints > 0)
		);
	</script>

		html {

		body {
			height: 100%;
			overflow: hidden;
			margin: 0;
			padding: 0;
			font-family: Arial, Helvetica, sans-serif;
			font-size: 16px;
			color: #FFFFFF;

		/* ---- Initial loading overlay -------------------------------------
		   Sits on top of #pano until the scene's onloadcomplete event fires
		   in tour.xml (it calls js(hideLoadingOverlay()) once the actual
		   pano image/tiles have finished loading -- NOT krpano's onready,
		   which only means the viewer itself has initialized and can fire
		   well before the panorama is visible). Then fades out and removes
		   itself. Self-contained: safe to delete this whole block + the
		   #loadingOverlay div + the hideLoadingOverlay() function if the
		   loading screen is ever dropped (also remove the onloadcomplete
		   attribute from the <scene> tag in tour.xml). */
		#loadingOverlay {
			position: fixed;
			inset: 0;
			z-index: 9999;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: opacity 0.6s ease;
			background:
				radial-gradient(ellipse at 50% 68%, rgba(245, 166, 35, 0.55) 0%, rgba(232, 114, 44, 0.28) 22%, rgba(0, 0, 0, 0) 46%),
				linear-gradient(180deg, #1a1410 0%, #2c1c12 55%, #4a2e1a 78%, #6b3d1a 100%);
		}

		#loadingOverlay.hidden {
			opacity: 0;
			pointer-events: none;
		}

		#loadingOverlay .sun {
			position: absolute;
			left: 50%;
			top: 68%;
			width: 340px;
			height: 340px;
			transform: translate(-50%, -50%);
			border-radius: 50%;
			background: radial-gradient(circle at 50% 45%, #f5a623 0%, #e8722c 55%, rgba(232, 114, 44, 0) 72%);
			filter: blur(2px);
			animation: loadingSunRise 3.2s ease-out infinite alternate;
		}

		@keyframes loadingSunRise {
			from {
				top: 70%;
				opacity: 0.75;
			}

			to {
				top: 63%;
				opacity: 1;
			}
		}

		#loadingOverlay .horizon {
			position: absolute;
			left: 0;
			right: 0;
			top: 68%;
			height: 1px;
			background: linear-gradient(90deg, rgba(245, 166, 35, 0) 0%, rgba(245, 166, 35, 0.55) 50%, rgba(245, 166, 35, 0) 100%);
		}

		#loadingOverlay .loadingContent {
			position: relative;
			z-index: 2;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 34px;
		}

		#loadingOverlay .mark img {
			display: block;
			width: 260px;
			height: auto;
			filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.55));
			animation: loadingMarkPulse 3.2s ease-in-out infinite;
		}

		@keyframes loadingMarkPulse {

			0%,
			100% {
				filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 0 rgba(245, 166, 35, 0));
			}

			50% {
				filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 24px rgba(245, 166, 35, 0.55));
			}
		}

		#loadingOverlay .status {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 12px;
		}

		#loadingOverlay .track {
			width: 220px;
			height: 3px;
			border-radius: 2px;
			background: rgba(250, 246, 239, 0.18);
			overflow: hidden;
		}

		#loadingOverlay .fill {
			height: 100%;
			width: 30%;
			border-radius: 2px;
			background: linear-gradient(90deg, #e8722c, #f5a623);
			animation: loadingBarSweep 1.6s ease-in-out infinite;
		}

		@keyframes loadingBarSweep {
			0% {
				transform: translateX(-100%);
				width: 40%;
			}

			50% {
				width: 55%;
			}

			100% {
				transform: translateX(260%);
				width: 40%;
			}
		}

		#loadingOverlay .label {
			font-size: 12px;
			letter-spacing: 0.06em;
			color: rgba(250, 246, 239, 0.6);
		}

		@media (prefers-reduced-motion: reduce) {
			#loadingOverlay .sun {
				animation: none;
				top: 66%;
			}

			#loadingOverlay .fill {
				animation: none;
				width: 60%;
			}
		}

		@media (max-width: 480px) {
			#loadingOverlay .mark img {
				width: 190px;
			}

			#loadingOverlay .track {
				width: 170px;
			}
		}
	</style>

	<script>
		// Measures a landmark label's true rendered width using the browser's
		// own canvas text-metrics API, then hands the result to krpano via
		// landmark_apply_measured_width. This replaces krpano's own
		// auto-size/pixelwidth text measurement, which turned out to be
		// unreliable (it could report a mid-layout or overflow-clipped size
		// depending on timing, permanently stuck the flag-reveal animation
		// after 1-2 letters). canvas.measureText() has no such race — it's a
		// synchronous, deterministic browser API.
		// Called directly from gui_fov_kumaran.xml's landmark_define via
		// js(landmark_measureLabel('<slug>', '<label>')), so the label text
		// stays single-sourced in the XML roster — nothing to keep in sync
		// here.
		window.__landmarkMeasureCtx = null;
		window.landmark_measureLabel = function (slug, label) {
			if (!window.__landmarkMeasureCtx) {
				window.__landmarkMeasureCtx = document.createElement("canvas").getContext("2d");
			}
			var ctx = window.__landmarkMeasureCtx;
			// Must match the label hotspot's css exactly (font-weight, size, family)
			// in gui_fov_kumaran.xml's landmark_apply_measured_width, or the
			// measured width won't match what actually renders.
			ctx.font = "bold 13px Arial, Helvetica, sans-serif";
			// label may contain HTML entities (e.g. "&amp;") since it's used
			// directly as hotspot html; decode them so we measure the text as
			// it will actually be rendered ("&", not "&amp;").
			var decodeEl = document.createElement("textarea");
			decodeEl.innerHTML = label;
			var plainText = decodeEl.value;
			var textWidth = Math.ceil(ctx.measureText(plainText).width);
			// padding-left:10px + padding-right:10px (from the label css) + a
			// couple px buffer so the last letter isn't clipped.
			var revealWidth = textWidth + 22;
			if (window.krpano) {
				window.krpano.call("landmark_apply_measured_width('" + slug + "', " + revealWidth + ");");
			} else {
				console.error("landmark_measureLabel: window.krpano not set yet for", slug);
			}
		};

		// Guards against start_landmark_reveals() firing more than once per
		// page load — hotspots.xml has multiple internal triggers (its own
		// onstart + onloadcomplete) as a deliberate belt-and-suspenders, so
		// this can legitimately be called 2-3 times per load. Kept in plain
		// window state (not a krpano variable) so it survives regardless of
		// how many times the underlying XML/event fires.
		window.landmarkRevealsStartOnce = function () {
			if (window.__landmarksInitialized) {
				return;
			}
			window.__landmarksInitialized = true;
			if (window.krpano) {
				window.krpano.call("init_all_landmarks();");
				window.krpano.call("reveal_watch_loop();");
			} else {
				console.error("landmarkRevealsStartOnce: window.krpano not set yet");
			}
		};

		// Fades out and removes #loadingOverlay. Called from tour.xml's
		// <scene onloadcomplete="js(hideLoadingOverlay());"> — that fires
		// once the pano's actual image/tiles have finished loading and are
		// on screen, unlike onready below (which only means the krpano
		// viewer itself has initialized, well before the panorama is
		// visible, so hiding the overlay there let it disappear too early).
		function hideLoadingOverlay() {
			var overlay = document.getElementById("loadingOverlay");
			if (!overlay) return;
			overlay.classList.add("hidden");
			setTimeout(function () { overlay.remove(); }, 650); // matches the CSS transition duration
		}

		embedpano({
			xml: "tour.xml",
			target: "pano",
			// Same touch-capability test the mobile CSS relies on (see
			// action-bar.css / filter-panel.css / plot-popup-mobile.css),
			// so krpano's XML sees the exact same "is this mobile" answer
			// as the rest of the page instead of its own separate
			// user-agent-based device.mobile detection, which can
			// disagree with reality (desktop-site mode, some in-app
			// browsers, etc.). tour.xml's <skin_settings maps="..."/>
			// reads this as js_is_mobile.
			initvars: {
				js_is_mobile: document.documentElement.classList.contains("is-touch-device")
			},
			onready: function (krpanoInterface) {
				krpano = krpanoInterface;        // must be global — plot-popup.js reads window.krpano
				plotPopup.init("all_plots_matched.json"); // starts loading your plot data
				// hideLoadingOverlay() intentionally NOT called here — see
				// tour.xml's onloadcomplete instead.

				// Safety net: if onloadcomplete never fires for some reason
				// (e.g. a slow/odd network condition), don't leave the
				// overlay stuck on screen forever.
				setTimeout(hideLoadingOverlay, 20000);
			}
		});
	</script>

	<div id="plotPopupRoot"></div>
	<div id="plotActionBarRoot"></div>
	<div id="plotFilterRoot"></div>
	<div id="enquiryPopupRoot"></div>

	<script>
		// Keeps the custom overlay UI (action bar, filter bar, plot popup,
		// enquiry popup) visible when krpano's landscape/immersive mode
		// takes an element fullscreen (confirmed via DevTools showing a
		// "top-layer" badge on #krpanoSWFObject in landscape on Android).
		// Per the Fullscreen API spec, ONLY the fullscreened element and
		// its own descendants are painted -- everything else in the page
		// is invisible regardless of its CSS, even though its inline
		// style still correctly says display:block. These four divs are
		// siblings of the pano container, not descendants of it, so they
		// disappear the instant fullscreen engages. The fix: move them
		// INTO the fullscreen element while it's active, and move them
		// back out to <body> the moment fullscreen ends.
		(function () {
			"use strict";
			var OVERLAY_IDS = [
				"plotPopupRoot",
				"plotActionBarRoot",
				"plotFilterRoot",
				"enquiryPopupRoot"
			];

			function getFullscreenElement() {
				return document.fullscreenElement ||
					document.webkitFullscreenElement ||
					document.mozFullScreenElement ||
					document.msFullscreenElement ||
					null;
			}

			function moveOverlaysInto(target) {
				OVERLAY_IDS.forEach(function (id) {
					var el = document.getElementById(id);
					if (el && el.parentNode !== target) {
						target.appendChild(el);
					}
				});
			}

			function moveOverlaysBack() {
				OVERLAY_IDS.forEach(function (id) {
					var el = document.getElementById(id);
					if (el && el.parentNode !== document.body) {
						document.body.appendChild(el);
					}
				});
			}

			function onFullscreenChange() {
				var fsEl = getFullscreenElement();
				if (fsEl && fsEl !== document.documentElement) {
					// Confirm the element actually has real layout (width/height > 0)
					// before trusting it — a rejected/half-applied fullscreen request
					// can leave document.fullscreenElement set to something with no
					// real box yet, which is what seems to trip up Vivo on first rotate.
					var rect = fsEl.getBoundingClientRect();
					if (rect.width > 0 && rect.height > 0) {
						moveOverlaysInto(fsEl);
					}
				} else {
					moveOverlaysBack();
				}
			}

			["fullscreenchange", "webkitfullscreenchange",
				"mozfullscreenchange", "MSFullscreenChange"
			].forEach(function (evt) {
				document.addEventListener(evt, onFullscreenChange);
			});
		})();
	</script>

	<script>
		(function () {
			var slider = document.getElementById('labelRzSlider');
			var valueLabel = document.getElementById('labelRzValue');
			function apply(val) {
				valueLabel.textContent = val;
				if (window.krpano) {
					window.krpano.call("set_all_label_rz(" + val + ");");
				}
			}
			slider.addEventListener('input', function () {
				apply(slider.value);
			});
		})();
	</script>
