<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunrise Valley — Loading</title>
<style>
  :root {
    --sky-deep: #1a1410;
    --sky-mid: #4a2e1a;
    --sun-core: #f5a623;
    --sun-edge: #e8722c;
    --paper: #faf6ef;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--sky-deep);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 50% 68%, rgba(245,166,35,0.55) 0%, rgba(232,114,44,0.28) 22%, rgba(0,0,0,0) 46%),
      linear-gradient(180deg, var(--sky-deep) 0%, #2c1c12 55%, var(--sky-mid) 78%, #6b3d1a 100%);
  }

  /* rising sun disc behind the mark */
  .sun {
    position: absolute;
    left: 50%;
    top: 68%;
    width: 340px;
    height: 340px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, var(--sun-core) 0%, var(--sun-edge) 55%, rgba(232,114,44,0) 72%);
    filter: blur(2px);
    animation: rise 3.2s ease-out infinite alternate;
  }

  @keyframes rise {
    from { top: 70%; opacity: 0.75; }
    to   { top: 63%; opacity: 1; }
  }

  /* horizon line */
  .horizon {
    position: absolute;
    left: 0;
    right: 0;
    top: 68%;
    height: 1px;
    background: linear-gradient(90deg, rgba(245,166,35,0) 0%, rgba(245,166,35,0.55) 50%, rgba(245,166,35,0) 100%);
  }

  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 34px;
  }

  .mark {
    padding: 22px 34px;
    background: rgba(250, 246, 239, 0.94);
    border-radius: 10px;
    box-shadow: 0 18px 46px rgba(0,0,0,0.35);
    animation: settle 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .mark img {
    display: block;
    width: 260px;
    height: auto;
  }

  @keyframes settle {
    from { opacity: 0; transform: translateY(14px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .status {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    animation: settle 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
    animation-delay: 150ms;
    opacity: 0;
    animation-fill-mode: forwards;
  }

  .track {
    width: 220px;
    height: 3px;
    border-radius: 2px;
    background: rgba(250, 246, 239, 0.18);
    overflow: hidden;
  }

  .fill {
    height: 100%;
    width: 30%;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--sun-edge), var(--sun-core));
    animation: loadbar 1.6s ease-in-out infinite;
  }

  @keyframes loadbar {
    0%   { transform: translateX(-100%); width: 40%; }
    50%  { width: 55%; }
    100% { transform: translateX(260%); width: 40%; }
  }

  .label {
    font-size: 12px;
    letter-spacing: 0.06em;
    color: rgba(250, 246, 239, 0.6);
  }

  @media (prefers-reduced-motion: reduce) {
    .sun { animation: none; top: 66%; }
    .fill { animation: none; width: 60%; }
    .mark, .status { animation: none; opacity: 1; }
  }

  @media (max-width: 480px) {
    .mark { padding: 16px 22px; }
    .mark img { width: 190px; }
    .track { width: 170px; }
  }
</style>
</head>
